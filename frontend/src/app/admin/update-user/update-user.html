<div class="max-w-3xl mx-auto space-y-6 pb-12">
  
  <div class="flex items-center space-x-4">
    <a routerLink="/admin/users" 
       class="p-2 text-gray-400 hover:text-gray-900 bg-white border border-gray-200 rounded-full shadow-sm hover:bg-gray-50 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
    </a>
    <div>
      <h2 class="text-2xl font-extrabold text-gray-900">Modify Member Record</h2>
      <p class="text-sm text-gray-500 mt-1">Alter identity parameters or operational criteria logs securely.</p>
    </div>
  </div>

  @if (isLoading()) {
    <div class="flex justify-center items-center py-24 bg-white rounded-3xl border border-gray-100 shadow-sm">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-orange-600"></div>
    </div>
  }

  @if (!isLoading()) {
    <div class="bg-white rounded-3xl border border-gray-100 shadow-sm overflow-hidden p-6 sm:p-8">
      
      <form (ngSubmit)="onSubmitChanges()" class="space-y-6">
        
        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">User Full Name</label>
          <input type="text"
                 [ngModel]="fullname()"
                 (ngModelChange)="fullname.set($any($event))"
                 name="fullname" required
                 placeholder="e.g. John Doe"
                 class="block w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:border-orange-500 focus:ring-orange-500 bg-gray-50/50 transition-all font-medium text-gray-900">
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">Email Address</label>
          <input type="email"
                 [ngModel]="email()"
                 (ngModelChange)="email.set($any($event))"
                 name="email" required
                 placeholder="username@domain.com"
                 class="block w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:border-orange-500 focus:ring-orange-500 bg-gray-50/50 transition-all font-medium text-gray-900">
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400">Assigned Authorization Role</label>
          <select [value]="selectedRoleId()"
                  (change)="selectedRoleId.set($any($event.target).value)"
                  name="role" required
                  class="block w-full rounded-xl border border-gray-300 px-4 py-3 text-sm focus:border-orange-500 focus:ring-orange-500 bg-gray-50/50 cursor-pointer transition-all font-medium text-gray-900">
            <option value="" disabled>Select authorization group...</option>
            
            @for (role of rolesCollection(); track role._id) {
              <option [value]="role._id">{{ role.rolename || role.name }}</option>
            }
            
          </select>
          <p class="text-[11px] text-gray-400 mt-1">Altering this choice assigns alternative system-wide clearance rules to this user account instantly.</p>
        </div>

        <div class="flex items-center justify-end gap-3 border-t border-gray-100 pt-6 mt-8">
          <a routerLink="/admin/users"
             class="px-5 py-2.5 rounded-xl border border-gray-300 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors shadow-sm">
            Cancel
          </a>
          <button type="submit"
                  [disabled]="isUpdating() || !fullname().trim() || !email().trim() || !selectedRoleId()"
                  class="px-6 py-2.5 rounded-xl bg-orange-600 text-sm font-bold text-white shadow-sm hover:bg-orange-500 transition-colors disabled:opacity-50 flex items-center">
            @if (isUpdating()) {
              Saving Changes...
            } @else {
              Update User Profile
            }
          </button>
        </div>

      </form>

    </div>
  }

</div>
