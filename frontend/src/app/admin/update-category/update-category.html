<div class="max-w-4xl mx-auto space-y-8 pb-16 pt-4">
  
  <div class="flex items-center space-x-5">
    <a routerLink="/admin/category" 
       class="p-2.5 text-gray-400 hover:text-gray-900 bg-white border border-gray-200 rounded-full shadow-sm hover:bg-gray-50 transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
      </svg>
    </a>
    <div class="space-y-0.5">
      <h2 class="text-2xl font-extrabold text-gray-900 tracking-tight">Modify Category Structure</h2>
      <p class="text-sm text-gray-500">Alter classifications, rewrite context details, or change group thumbnails.</p>
    </div>
  </div>

  @if (isLoading()) {
    <div class="flex justify-center items-center py-32 bg-white rounded-3xl border border-gray-100 shadow-sm">
      <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-orange-600"></div>
    </div>
  }

  @if (!isLoading()) {
    <div class="bg-white rounded-3xl border border-gray-100 shadow-sm p-6 sm:p-10 animate-fadeIn">
      
      <form (ngSubmit)="onSubmitCategoryUpdate()" class="space-y-10">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-10 items-start">
          
          <div class="space-y-3">
            <label class="block text-xs font-black uppercase tracking-wider text-gray-400">Category Cover Preview</label>
            <div class="w-full aspect-square rounded-2xl border border-gray-200 bg-slate-50/50 flex items-center justify-center overflow-hidden relative group shadow-inner">
              @if (image()) {
                <img [src]="image()" 
                     alt="Live Preview" 
                     class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                     (error)="$any($event.target).src = 'https://placehold.co/300x300/png?text=Broken+Link+⚠️'">
              } @else {
                <div class="text-center p-6">
                  <span class="text-4xl block mb-3 text-slate-400">📦</span>
                  <span class="text-xs font-bold text-gray-400 uppercase tracking-wider block">No Media Link</span>
                </div>
              }
            </div>
          </div>

          <div class="md:col-span-2 space-y-6">
            
            <div class="space-y-2">
              <label class="block text-xs font-black uppercase tracking-wider text-gray-400">Classification Title</label>
              <input type="text"
                     [ngModel]="categoryname()"
                     (ngModelChange)="categoryname.set($any($event))"
                     name="categoryname" required
                     placeholder="e.g. Mechanical Keyboards"
                     class="block w-full rounded-xl border border-gray-300 px-4 py-3.5 text-sm focus:border-orange-500 focus:ring-orange-500 bg-gray-50/50 transition-all font-bold text-gray-900 shadow-sm">
            </div>

            <div class="space-y-2">
              <label class="block text-xs font-black uppercase tracking-wider text-gray-400">Category Image Asset URL</label>
              <input type="url"
                     [ngModel]="image()"
                     (ngModelChange)="image.set($any($event))"
                     name="image"
                     placeholder="https://example.com/assets/images/category-thumb.jpg"
                     class="block w-full rounded-xl border border-gray-300 px-4 py-3.5 focus:border-orange-500 focus:ring-orange-500 bg-gray-50/50 transition-all font-mono text-xs text-gray-700 shadow-sm">
            </div>

            <div class="space-y-2">
              <label class="block text-xs font-black uppercase tracking-wider text-gray-400">Catalog Context Scope Description</label>
              <textarea [ngModel]="description()"
                        (ngModelChange)="description.set($any($event))"
                        name="description" rows="4"
                        placeholder="Detail the catalog criteria required for products to fall under this cluster grouping..."
                        class="block w-full rounded-xl border border-gray-300 px-4 py-3.5 text-sm focus:border-orange-500 focus:ring-orange-500 bg-gray-50/50 transition-all font-medium text-gray-900 resize-none shadow-sm"></textarea>
            </div>

          </div>
        </div>

        <div class="flex items-center justify-end gap-4 border-t border-gray-100 pt-8 mt-10">
          <a routerLink="/admin/category"
             class="btn-cancel-product">
            Cancel
          </a>
          <button type="submit"
                  [disabled]="isSubmitting() || !categoryname().trim()"
                  class="btn-submit">
            @if (isSubmitting()) {
              <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
              </svg>
              Committing Records...
            } @else {
              Apply Category Changes
            }
          </button>
        </div>

      </form>
    </div>
  }
</div>
