<div class="flex h-[calc(100vh-4rem)] bg-gray-50 font-sans w-full">

  <aside class="w-64 bg-slate-900 text-white flex-col hidden md:flex">
    
    <div class="h-16 flex items-center px-6 border-b border-slate-800">
      <h1 class="text-xl font-black tracking-wider text-orange-500">ADMIN<span class="text-white">PANEL</span></h1>
    </div>

    <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
      
      <a routerLink="/admin/dashboard" routerLinkActive="bg-orange-600 text-white" [routerLinkActiveOptions]="{exact: true}" 
         class="flex items-center px-4 py-3 text-sm font-medium text-slate-300 rounded-xl hover:bg-slate-800 hover:text-white transition-colors gap-3">
        <ng-icon name="faSolidHouse" size="18"></ng-icon>
        Dashboard
      </a>

      <a routerLink="/admin/users" routerLinkActive="bg-orange-600 text-white"
         class="flex items-center px-4 py-3 text-sm font-medium text-slate-300 rounded-xl hover:bg-slate-800 hover:text-white transition-colors gap-3">
        <ng-icon name="faSolidUserGroup" size="18"></ng-icon>
        Users
      </a>

      <a routerLink="/admin/products" routerLinkActive="bg-orange-600 text-white"
         class="flex items-center px-4 py-3 text-sm font-medium text-slate-300 rounded-xl hover:bg-slate-800 hover:text-white transition-colors gap-3">
        <ng-icon name="faSolidBoxOpen" size="18"></ng-icon>
        Products
      </a>

      <a routerLink="/admin/category" routerLinkActive="bg-orange-600 text-white"
         class="flex items-center px-4 py-3 text-sm font-medium text-slate-300 rounded-xl hover:bg-slate-800 hover:text-white transition-colors gap-3">
        <ng-icon name="faSolidClipboardList" size="18"></ng-icon>
        Category
      </a>

      <a routerLink="/admin/orders" routerLinkActive="bg-orange-600 text-white"
         class="flex items-center px-4 py-3 text-sm font-medium text-slate-300 rounded-xl hover:bg-slate-800 hover:text-white transition-colors gap-3">
        <ng-icon name="faSolidCartShopping" size="18"></ng-icon>
        Orders
      </a>

      <a routerLink="/admin/roles" routerLinkActive="bg-orange-600 text-white"
         class="flex items-center px-4 py-3 text-sm font-medium text-slate-300 rounded-xl hover:bg-slate-800 hover:text-white transition-colors gap-3">
        <ng-icon name="faSolidUserGear" size="18"></ng-icon>
        Roles
      </a>

      <a routerLink="/admin/permissions" routerLinkActive="bg-orange-600 text-white"
         class="flex items-center px-4 py-3 text-sm font-medium text-slate-300 rounded-xl hover:bg-slate-800 hover:text-white transition-colors gap-3">
        <ng-icon name="faSolidKey" size="18"></ng-icon>
        Permission
      </a>

      
      
    </nav>

    <div class="p-4 border-t border-slate-800">
      <a routerLink="/products" class="flex items-center w-full px-4 py-2 text-sm font-medium text-slate-400 hover:text-white transition-colors cursor-pointer gap-3">
        <svg class="w-5 h-5 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Back to Store
      </a>
    </div>
  </aside>

  <main class="flex-1 flex flex-col overflow-hidden bg-gray-50">
    
    <div class="flex-1 overflow-y-auto p-6 relative">
      <router-outlet></router-outlet>
    </div>

  </main>
</div>
